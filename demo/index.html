.flow-card:hover{background:#f3f6ec}.flow-card small{color:#647059}
.record-card,.work-period{background:#fffef9;box-shadow:none}
.record-management{border-top:1px solid var(--line);padding-top:20px;margin:28px 0 4px}
.record-management h3{font-size:16px;margin:0 0 10px}
.record-management .small{margin:6px 0 12px}.record-management .btn{margin:10px 0 0}
.record-management .action-pair{margin-top:12px}
.record-management .action-pair .btn{margin:0;flex:1}
.form-section{border:0;margin:0 0 22px;padding:0;min-width:0}
.form-section legend{font-size:15px;font-weight:600;margin-bottom:12px;padding:0;color:var(--ink)}
.form-section .field:last-child{margin-bottom:0}
.form-section .two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan-tools{gap:8px;display:flex;flex-wrap:wrap;align-items:center;margin:12px 0 22px}
.plan-tools .btn.small{font-size:12px;min-height:40px;padding:8px 10px}
.plan-tools .badge{margin-right:auto}
.worker-checks{border-color:#e0e5d8;background:#fffef9}
.worker-checks .check{border-bottom:1px solid #edf0e8;margin:0;padding:10px 0}
.worker-checks .check:last-child{border-bottom:0}
.worker-checks .check input{width:20px;height:20px}
.planning-segment{background:#fffef9;border:1px solid #dce3d2;border-radius:12px;padding:0;margin:12px 0}
.plan-segment-head{padding:14px 14px 12px;border-bottom:1px solid #e7ebdf}
.plan-segment-head strong{display:block;font-size:15px;color:#33472b}
.plan-segment-head p{font-size:12px;color:#65735b;margin:4px 0 0}
.planned-worker-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;min-height:58px}
.planned-worker-row+.planned-worker-row{border-top:1px solid #edf0e7}
.planned-worker-row>span{font-size:14px;min-width:0;overflow-wrap:anywhere}
.segment-edit{min-height:44px;min-width:54px;padding:8px 12px;background:#fffef9;border:1px solid #ccd8be;font-size:13px;flex-shrink:0}
.work-progress-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;font-size:13px;color:#647059}
.worker-progress{background:transparent;border:0;border-left:3px solid #b1c49a;padding:3px 0 3px 12px;margin:0 0 18px}
.worker-progress p{margin:3px 0;font-size:13px}
.work-period{border:1px solid #dce3d2;padding:16px;margin-top:8px}
.work-period .row{margin-bottom:12px}.work-period h3{font-size:16px}
.work-period .two-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.work-period .overnight-hint{font-size:12px;margin:-5px 0 14px}
.break-fields{padding-top:12px}.break-toggle{font-size:13px;margin:0}
.actual-confirmation{border-top:1px solid var(--line);margin-top:20px;padding-top:12px}
.actual-confirmation .hint{margin:0 0 10px}.actual-confirmation .check{font-size:14px}
.permission-group{border:0;border-top:1px solid var(--line);padding:16px 0 0;margin:20px 0;min-width:0}
.permission-group legend{font-weight:600;font-size:14px;padding:0 8px 0 0}
.permission-group .check{align-items:flex-start;font-size:14px;margin:8px 0}
.permission-group .check input{margin-top:3px}
.setup-card .panel-heading{align-items:flex-start;flex-wrap:wrap}.setup-card .panel-heading h3{flex-basis:100%}
.tablet .setup-card .panel-heading h3{flex-basis:auto}
.content .notice:not(.error):not(.work-attention){box-shadow:none}


/* Tablet review: independent workspace lists and full-width single action cards. */
.tablet-workspace{display:none}
.tablet .tablet-workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:24px;align-items:start}
.workspace-panel{min-width:0;background:#fffef9;border:1px solid #dce2d3;border-radius:14px;padding:20px}
.workspace-panel.campaign-panel{grid-column:1/-1}
.workspace-panel .panel-heading h3{font-size:18px;line-height:1.4}
.count-label{font-size:13px;font-weight:400;color:#68765c;margin-left:5px}
.workspace-panel .listitem{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #e5eadd;padding:15px 0}
.workspace-panel .listitem:last-child{border-bottom:0;padding-bottom:0}
.workspace-panel .listitem>div{min-width:0;overflow-wrap:anywhere}
.workspace-panel .listitem .link{font-size:13px;flex-shrink:0}
.workspace-panel .empty-panel{margin:18px 0 4px}
.campaign-areas-meta{grid-column:1/-1}
.campaign-areas-meta dd{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:400;font-size:14px;margin-top:7px}
.campaign-areas-meta dd span{overflow-wrap:anywhere;min-width:0}
.flow-card>span:last-child{flex:0 0 auto;margin-left:auto;align-self:center}
.flow-card>span:first-child:not(.flow-number){flex:1;min-width:0}
.flow-card>span:nth-child(2):not(:last-child){min-width:0}
.flow-card small{white-space:normal;overflow-wrap:anywhere}
.tablet .flow-actions:has(> .flow-card:only-child){grid-template-columns:minmax(0,1fr)}
@media(max-width:650px){.device.tablet .tablet-workspace{display:none}}


/* Persistent route navigation replaces the isolated business/workspace links. */
.workspace-navigation{display:flex;gap:6px;padding:12px 24px;border-bottom:1px solid #e0e6d6;background:#fffef9}
.workspace-navigation button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid transparent;border-radius:9px;background:transparent;color:#5f6e53;font-size:13px;font-weight:600;padding:8px 10px;line-height:1.3}
.workspace-navigation button[aria-current="page"]{background:#eaf0df;color:#344d25;border-color:#c8d6b6}
.workspace-navigation button:hover{background:#f1f5e9;color:#344d25}
.workspace-navigation button:focus-visible{outline:3px solid #7b9355;outline-offset:2px}
.workspace-navigation button span{font-size:18px;font-weight:400}
.tablet .workspace-navigation{justify-content:center;padding:12px 44px}
.tablet .workspace-navigation button{flex:0 1 240px}
@media(max-width:650px){.device.tablet .workspace-navigation{padding:12px 24px}.device.tablet .workspace-navigation button{flex:1}}

<body>
<main class="review">
 <div class="review-title"><div><h1>OliveTrack · Interactive prototype</h1><p>Interactive prototype · mobile and tablet</p></div><span class="badge">Review build</span></div>
 <div class="toolbar" aria-label="Prototype preview controls">
  <button type="button" id="mobile" aria-pressed="true">Mobile</button><button type="button" id="tablet" aria-pressed="false">Tablet</button>
  <label for="screen-picker">Screen</label><select id="screen-picker" aria-label="Preview screen"></select>
  <button type="button" id="simulate" class="hidden">Simulate email verification</button>
  <button type="button" id="simulate-reset" class="hidden">Open simulated reset email link</button>
  <button type="button" id="network-toggle" aria-pressed="false">Go offline</button><button type="button" id="load-demo">Load demo workspace</button><label for="preview-role">Role</label><select id="preview-role"><option value="owner">Owner</option><option value="manager">Manager (demo)</option></select>
  <button type="button" id="restart" class="end">Restart</button>
 </div>
 <div class="device" id="device" aria-label="OliveTrack prototype"><div id="app"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div></div>
 <p class="review-foot">Local prototype with fictional data. Sign-in and emails are simulated. Nothing is sent or retained after reloading the page.</p>
 <p class="review-foot"><a href="GUIA-DE-TESTES.html" target="_blank" rel="noopener">Screen guide &amp; test checklist</a></p>
 <div id="review-status" class="review-status center" aria-live="polite"></div>
</main>
<script src="vendor/pdf-lib.min.js"></script>
<script>
(()=>{
'use strict';
const app=document.getElementById('app'),device=document.getElementById('device'),picker=document.getElementById('screen-picker'),simulate=document.getElementById('simulate');
const screens={login:'A01 · Log In',register:'A02 · Create Account',verify:'A03 · Verify Email',verified:'A03b · Email Verified',recover:'A04 · Recover Access',reset:'A05 · Reset Password',resetDone:'A06 · Password Updated',home:'B01 · Home',property:'B04 · Add Property',worker:'W03 · Add Worker',campaign:'B07 · Create Campaign',campaignDetails:'B06 · Campaign Details',dayPlan:'C01 · Plan Daily Work',attendance:'C02 · Confirm Attendance',actualWork:'C03 · Record Actual Work',dailySummary:'C04 · Daily Summary',business:'B00 · Business Overview',deliveries:'D01 · Deliveries',newDelivery:'D02 · Register Delivery',deliveryDetails:'D03 · Delivery Details',ticket:'D04 · Weighing Ticket',analysis:'D05 · Analysis Results',valuation:'D06 · Delivery Value',indicators:'E01 · Campaign Indicators',closeCampaign:'E02 · Close Campaign',startCampaign:'C00 · Start Campaign',workerDetails:'W04 · Worker Record',editWorker:'W05 · Edit Worker',workerDocuments:'W06 · Worker Documents',uploadDocument:'W07 · Upload Document',documentDetails:'W08 · Document Details',signDocument:'W09 · Review and Sign',propertyDetails:'P01 · Property Record',editProperty:'P02 · Edit Property',editPlan:'C05 · Edit Planned Assignment',editWork:'C06 · Correct Work Period',editDelivery:'D07 · Edit Delivery',managers:'M01 · Managers and Invitations',managerAccess:'M02 · Manager Permissions',generateDocument:'W10 · Generate Document',moveDelivery:'D08 · Move Delivery',campaignSettings:'C07 · Campaign Settings',signOut:'A07 · Sign Out'};
const state={view:'login',mode:'mobile',owner:'Demo Owner',email:'owner@example.com',business:'Olive Harvest Business',verified:true,properties:[],workers:[],campaigns:[],parcels:0,homeTab:'campaigns',resetRequested:false};
let counter=1,toastTimer;
state.day='2026-11-01';state.attendance={};state.periodDraft=0;state.documents=[];state.online=true;state.simplePending=0;state.managers=[];state.role='owner';state.lastPermissionsValidation=Date.now();
const currentCampaign=()=>state.campaigns[state.selectedCampaign??state.campaigns.length-1];
const records=c=>{c.status??=c.actualStart?'in_progress':'planned';c.plans??=[];c.work??=[];c.deliveries??=[];return c;};
const lifecycle=c=>c?.status==='closed'?'closed':c?.actualStart?'in_progress':'planned';
const lifecycleLabel=c=>({planned:'Planned',in_progress:'In progress',closed:'Closed'}[lifecycle(c)]);
const executionConflict=c=>state.campaigns.find(other=>other!==c&&lifecycle(other)==='in_progress'&&other.coverage.some(a=>c.coverage.some(b=>a.propertyId===b.propertyId&&(!a.parcelId||!b.parcelId||a.parcelId===b.parcelId))));
const offlineExpired=()=>!state.online&&Date.now()-(state.lastPermissionsValidation||0)>=15*24*60*60*1000;
const identificationKey=w=>[w.idType,w.idCountry,w.idNumber].map(x=>String(x||'').trim().toUpperCase()).join('|');
const workerName=id=>state.workers.find(w=>w.id===id)?.name||'Worker';
const durationLabel=m=>Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m';
const stamp=(day,time)=>Date.parse(day+'T'+time+':00Z')/60000;
function dayControl(){const label=new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(state.day+'T12:00:00Z'));return `<div class="field day-field"><label for="work-day">Work day</label><div class="day-navigation"><button type="button" data-day-step="-1" aria-label="Previous day">←</button><input type="date" id="work-day" value="${state.day}" required><button type="button" data-day-step="1" aria-label="Next day">→</button></div><div class="day-caption">${label}</div></div>`;}
function plannedSegments(c,plans){const groups=new Map();for(const p of plans){const key=[p.area,p.from,p.to,p.next].join('|');if(!groups.has(key))groups.set(key,{...p,entries:[]});groups.get(key).entries.push(p);}return [...groups.values()].map(p=>`<article class="planning-segment"><header class="plan-segment-head"><strong>${p.from?esc(p.from)+' – '+esc(p.to)+(p.next?' · next day':''):'Hours not set'}</strong><p>${esc(c.coverage[p.area].label)} · ${p.entries.length} worker${p.entries.length===1?'':'s'}</p></header>${p.entries.map(entry=>`<div class="planned-worker-row"><span>${esc(workerName(entry.worker))}</span><button type="button" class="segment-edit" aria-label="Edit ${esc(workerName(entry.worker))} assignment" data-edit-plan="${c.plans.indexOf(entry)}">Edit</button></div>`).join('')}</article>`).join('');}

function noCampaign(){return `<div class="form-body">${back()}<h2>Select a campaign first</h2><p class="sub">Open a campaign from your workspace to manage its work.</p>${btn('Back to workspace','home')}</div>`;}
function areaOptions(c){return c.coverage.map((a,i)=>`<option value="${i}">${esc(a.label)}</option>`).join('');}
function workHeader(c,title,subtitle){return `<div class="form-body">${back('campaignDetails','Campaign')}<p class="eyebrow">${esc(c.name)}</p><h2>${title}</h2><p class="sub">${subtitle}</p>${dayControl()}`;}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(id,label,type='text',value='',optional=false,extra='')=>`<div class="field"><label for="${id}">${label}${optional?' <span class="optional">Optional</span>':''}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${optional?'':'required'} ${extra}></div>`;
const btn=(text,route,secondary=false)=>`<button type="button" class="btn ${secondary?'secondary':''}" data-go="${route}">${text}</button>`;
const back=(route='home',label='Back')=>`<button type="button" class="link back" data-go="${route}">← ${label}</button>`;
const submit=(label)=>`<button class="btn" type="submit">${label}</button>`;
function workspaceNavigation(){const businessView=['business','managers','managerAccess'].includes(state.view);return `<nav class="workspace-navigation" aria-label="Main navigation"><button type="button" data-go="home" ${!businessView?'aria-current="page"':''}><span aria-hidden="true">▦</span> Workspace</button><button type="button" data-go="business" ${businessView?'aria-current="page"':''}><span aria-hidden="true">⌂</span> Business overview</button></nav>`;}
const head=auth=>`<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true">O</span>OliveTrack</div><span class="identity">${auth?'Harvest management':state.role==='manager'?'Manager account':'Owner account'}</span></header>${auth?'':workspaceNavigation()}`;
const error=()=>'<div id="form-error" class="notice error hidden" role="alert"></div>';
function toast(text){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=text;t.classList.remove('hidden');toastTimer=setTimeout(()=>t.classList.add('hidden'),3500);}
function go(view){clearTimeout(toastTimer);document.getElementById('toast').classList.add('hidden');state.view=view;if(view==='property')state.parcels=0;render();device.scrollTop=0;}
function showError(message){const e=document.getElementById('form-error');e.textContent=message;e.classList.remove('hidden');e.scrollIntoView({block:'nearest'});}
function login(){return `<div class="auth"><div class="intro"><p class="eyebrow">Your olive harvest, organised</p><h2>Welcome back</h2><p class="sub">Log in to manage your business.</p></div><form id="login-form">${error()}${field('email','Email','email',state.email,false,'autocomplete="username"')}${field('password','Password','password','demo-password',false,'autocomplete="off"')}<div class="right"><button type="button" class="link" data-go="recover">Forgot password?</button></div>${submit('Log in')}</form><div class="divider"></div><p class="center small">New to OliveTrack?</p>${btn('Create an account','register',true)}</div>`;}
function register(){return `<div class="auth">${back('login','Log in')}<h2>Create your account</h2><p class="sub">Start a workspace for your olive-harvest business.</p><form id="register-form">${field('full-name','Full name','text','',false,'autocomplete="name"')}${field('business-name','Business name')}${field('email','Email','email','',false,'autocomplete="email"')}${field('password','Password','password','',false,'autocomplete="new-password"')}${submit('Create account')}</form><p class="center small">Already have an account? <button class="link" type="button" data-go="login">Log in</button></p></div>`;}
function verify(){return `<div class="auth"><div class="symbol" aria-hidden="true">✉</div><p class="eyebrow">Account verification</p><h2>Check your email</h2><p class="sub">We sent a verification link to<br><strong>${esc(state.email)}</strong>.</p><p class="message">Open the link to activate your account. Your business information becomes available after verification.</p><button class="btn secondary" type="button" id="resend">Resend verification email</button><div class="center"><button class="link" type="button" data-go="login">Back to log in</button></div></div>`;}
function verified(){return `<div class="auth"><div class="symbol" aria-hidden="true">✓</div><p class="eyebrow">Account activated</p><h2>Email verified</h2><p class="sub">Your account is ready. Log in to start preparing your business.</p>${btn('Continue to log in','login')}</div>`;}
function recover(){return `<div class="auth">${back('login','Log in')}<h2>Recover your access</h2><p class="sub">Enter your email to request a password-reset link.</p><form id="recover-form">${field('email','Email','email',state.email)}${submit('Send reset link')}</form><div id="recover-message" class="notice hidden" role="status" style="margin-top:20px">If an eligible account uses this email, a recovery link will be sent.</div></div>`;}

function reset(){return `<div class="auth">${back('login','Log in')}<p class="eyebrow">Account security</p><h2>Set a new password</h2><p class="sub">Choose a new password for your account.</p><form id="reset-form">${error()}${field('new-password','New password','password','',false,'autocomplete="new-password"')}${field('confirm-password','Confirm new password','password','',false,'autocomplete="new-password"')}${submit('Reset password')}</form><p class="hint" style="margin-top:20px">For your security, return to log in after updating your password.</p></div>`;}
function resetDone(){return `<div class="auth"><div class="symbol" aria-hidden="true">✓</div><p class="eyebrow">Account security</p><h2>Password updated</h2><p class="sub">Your password has been reset. You can now log in with your new password.</p>${btn('Back to log in','login')}</div>`;}
function mobileHome(){const tab=state.homeTab||'campaigns';const tabs=[['campaigns','Campaigns',state.campaigns.length],['properties','Properties',state.properties.length],['workers','Workers',state.workers.length]];const config={campaigns:['Your campaigns','Create campaign','campaign','No campaigns yet','Add a property, then create a campaign to organise your harvest.'],properties:['Your properties','Add property','property','No properties yet','Add your first property and its optional parcels.'],workers:['Your workers','Add worker','worker','No workers yet','Prepare your team before heading to the field.']}[tab];const rows=tab==='campaigns'?state.campaigns.map((x,i)=>`<div class="listitem"><div><strong>${esc(x.name)}</strong><div class="small">Planned start · ${esc(x.start)} · ${lifecycleLabel(x)}${x.archived?' · Archived':''}</div></div><button class="link" data-campaign="${i}" type="button">View</button></div>`).join(''):tab==='properties'?state.properties.map(x=>`<div class="listitem"><div><strong>${esc(x.name)}</strong><div class="small">${esc(x.location)}${x.archived?' · Archived':''}${x.parcels.length?' · '+x.parcels.length+' parcels':''}</div></div><button type="button" class="link" data-property="${x.id}">View property</button></div>`).join(''):state.workers.map(x=>`<div class="listitem"><div><strong>${esc(x.name)}</strong><div class="small">${esc(x.phone)} · ${x.active===false?'Inactive':x.machine?'Machinery operator':'Active'}</div></div><button type="button" class="link" data-worker="${x.id}">View record</button></div>`).join('');return `<div class="mobile-home"><div class="home-tabs" role="tablist" aria-label="Workspace sections">${tabs.map(([id,label,count])=>`<button type="button" role="tab" aria-selected="${tab===id}" data-home-tab="${id}"><strong>${count}</strong><span>${label}</span></button>`).join('')}</div><section class="mobile-panel" role="tabpanel" aria-label="${config[0]}"><div class="panel-heading"><h3>${config[0]}</h3><button type="button" class="btn small" data-go="${config[2]}">${config[1]}</button></div>${rows||`<div class="compact-empty"><span class="seed" aria-hidden="true">↗</span><h3>${config[3]}</h3><p>${config[4]}</p></div>`}</section><p class="hint home-help">Select a section above to manage your properties, workers or campaigns.</p></div>`;}

function tabletHome(){return `<div class="tablet-workspace"><section class="workspace-panel campaign-panel" aria-labelledby="tablet-campaigns-title"><div class="panel-heading"><h3 id="tablet-campaigns-title">Your campaigns <span class="count-label">${state.campaigns.length}</span></h3><button type="button" class="btn small" data-go="campaign">Create campaign</button></div>${state.campaigns.map((c,i)=>`<div class="listitem"><div><strong>${esc(c.name)}</strong><div class="small">${esc(c.start)} · ${lifecycleLabel(c)}${c.archived?' · Archived':''}</div></div><button type="button" class="link" data-campaign="${i}">View campaign</button></div>`).join('')||'<p class="small empty-panel">Add a property, then create your first campaign.</p>'}</section><section class="workspace-panel" aria-labelledby="tablet-properties-title"><div class="panel-heading"><h3 id="tablet-properties-title">Your properties <span class="count-label">${state.properties.length}</span></h3><button type="button" class="btn small" data-go="property">Add property</button></div>${state.properties.map(p=>`<div class="listitem"><div><strong>${esc(p.name)}</strong><div class="small">${esc(p.location)}${p.archived?' · Archived':''}${p.parcels.length?' · '+p.parcels.length+' parcels':''}</div></div><button type="button" class="link" data-property="${p.id}">View property</button></div>`).join('')||'<p class="small empty-panel">Add a property and its optional parcels.</p>'}</section><section class="workspace-panel" aria-labelledby="tablet-workers-title"><div class="panel-heading"><h3 id="tablet-workers-title">Your workers <span class="count-label">${state.workers.length}</span></h3><button type="button" class="btn small" data-go="worker">Add worker</button></div>${state.workers.map(w=>`<div class="listitem"><div><strong>${esc(w.name)}</strong><div class="small">${esc(w.phone)} · ${w.active===false?'Inactive':w.machine?'Machinery operator':'Active'}</div></div><button type="button" class="link" data-worker="${w.id}">View record</button></div>`).join('')||'<p class="small empty-panel">Add contact details and identification for your team.</p>'}</section></div>`;}
function home(){const p=state.properties.length,w=state.workers.length,c=state.campaigns.length;return `<div class="home-head"><div><p class="eyebrow">${esc(state.business)}</p><h2>${p||w||c?'Your workspace':'Welcome, '+esc(state.owner.split(' ')[0])}</h2><p class="sub">Prepare your business, then organise the harvest.</p></div><span class="badge">${state.online?'Online':'Offline · demo'}</span></div>${mobileHome()}${tabletHome()}`;}
function property(){return `<div class="form-body">${back()}<div class="form-head"><p class="eyebrow">Property setup</p><h2>Add a property</h2><p class="sub">Start with the name and location. You can complete optional details later.</p></div><form id="property-form">${error()}${field('property-name','Property name')}${field('location','Location')}<div class="two-fields">${field('area','Declared area (ha)','number','',true,'min="0" step="any"')}${field('varieties','Olive varieties','text','',true)}</div><label class="check"><input type="checkbox" id="use-parcels">This property has parcels</label><div id="parcel-fields" class="hidden"><p class="small">Name each division. Parcel area is optional.</p><div id="parcel-list"></div><button type="button" class="link" id="add-parcel">+ Add another parcel</button></div><div style="margin-top:24px">${submit('Save property')}</div></form></div>`;}

function attendance(){const c=currentCampaign();if(!c)return noCampaign();records(c);const planned=new Set(c.plans.filter(p=>p.day===state.day).map(p=>p.worker));return workHeader(c,'Confirm attendance','Attendance is shared across your business for this day. It does not confirm working hours.')+`${error()}${state.workers.length?`<form id="attendance-form">${state.workers.map(w=>`<div class="attendance-row"><div><strong>${esc(w.name)}</strong><div class="small">${planned.has(w.id)?'Planned in this campaign':'Not planned in this campaign'}</div></div><div class="presence-buttons" role="group" aria-label="Attendance for ${esc(w.name)}" data-presence="${w.id}" data-value="${(state.attendance[state.day]||{})[w.id]||(planned.has(w.id)?'waiting':'not_selected')}">${[['present','Present'],['absent','Absent'],[planned.has(w.id)?'waiting':'not_selected',planned.has(w.id)?'Awaiting':'Not selected']].map(([value,label])=>`<button type="button" data-presence-value="${value}" aria-pressed="${((state.attendance[state.day]||{})[w.id]||(planned.has(w.id)?'waiting':'not_selected'))===value}">${label}</button>`).join('')}</div></div>`).join('')}${submit('Save attendance')}</form><div class="divider"></div>${btn('Continue to actual work','actualWork',true)}`:`<div class="empty"><h3>No workers yet</h3><p>Add a worker to prepare attendance.</p>${btn('Add worker','worker')}</div>`}</div>`;}

on('plan-form','submit',e=>{e.preventDefault();if(c.status==='closed')return showError('Reopen the campaign before changing its plan.');const ids=[...app.querySelectorAll('[name="plan-worker"]:checked')].map(x=>x.value),from=document.getElementById('plan-from').value,to=document.getElementById('plan-to').value,next=Boolean(from&&to&&to<from),area=Number(document.getElementById('plan-area').value);if(!ids.length)return showError('Select at least one worker.');if(Boolean(from)!==Boolean(to)||(!from&&next))return showError('Provide both times or leave both empty.');if(from&&stamp(state.day,to)+(next?1440:0)<=stamp(state.day,from))return showError('The end must be after the start.');if(c.work.some(w=>w.day===state.day&&w.area===area))return showError('The plan for this area and day is frozen because actual work has been confirmed.');const added=ids.map(worker=>({day:state.day,worker,from,to,next,area,task:''}));for(const a of added)for(const other of state.campaigns){for(const b of (other.plans||[])){if(planConflict(a,b))return showError('This worker already has overlapping planned hours.');if(a.worker===b.worker&&a.day===b.day&&(other!==c||a.area!==b.area)&&(!a.from||!b.from))return showError('Provide hours for all assignments when a worker is planned in multiple areas on the same day.');}}c.plans.push(...added);render();toast('Plan saved. Actual work still requires confirmation.');});

function indicators(){const c=currentCampaign();if(!c)return noCampaign();records(c);const delivered=c.deliveries.filter(d=>d.arrival&&!d.cancelled),weighed=delivered.filter(d=>d.ticket?.net!=null),net=weighed.reduce((n,d)=>n+d.ticket.net,0),eligible=delivered.filter(d=>d.analysis&&d.ticket?.net>0),weight=eligible.reduce((n,d)=>n+d.ticket.net,0),yieldValue=weight?eligible.reduce((n,d)=>n+d.analysis.yield*d.ticket.net,0)/weight:null,values=delivered.filter(d=>d.value),provisional=values.filter(d=>d.value.status==='Provisional').reduce((n,d)=>n+d.value.amount,0),final=values.filter(d=>d.value.status==='Final').reduce((n,d)=>n+d.value.amount,0),workers=new Set([...c.work.map(w=>w.worker),...c.plans.filter(p=>state.attendance[p.day]?.[p.worker]==='present').map(p=>p.worker)]),days=new Set(c.work.map(w=>w.day));return campaignHeader(c,'Campaign indicators','All recorded campaign days. Only confirmed work and delivered loads contribute to actual totals.')+`<div class="daily-stats harvest-stats"><div><strong>${kg(net)}</strong><span>Reported clean net weight</span></div><div><strong>${delivered.length}</strong><span>Delivered loads</span></div><div><strong>${yieldValue==null?'—':yieldValue.toFixed(2)+'%'}</strong><span>Weighted reported yield</span></div><div><strong>${euros(provisional+final)}</strong><span>Current reported value</span></div></div><p class="coverage-note">Weights: ${weighed.length}/${delivered.length} deliveries · Yield: ${eligible.length}/${delivered.length} deliveries (${kg(weight)}) · Values: ${values.length}/${delivered.length} deliveries</p><p class="small">${euros(final)} final + ${euros(provisional)} provisional. Missing values are excluded; they are not assumed to be zero.</p><div class="section-heading"><h3>Work across the campaign</h3></div><div class="daily-stats"><div><strong>${durationLabel(c.work.reduce((n,w)=>n+w.minutes,0))}</strong><span>Counted hours</span></div><div><strong>${workers.size}</strong><span>Present / assigned workers</span></div><div><strong>${days.size}</strong><span>Actual work days</span></div><div><strong>${c.deliveries.filter(d=>!d.arrival&&!d.cancelled).length}</strong><span>Loads in transit</span></div></div><div class="section-heading"><h3>Hours by task</h3></div>${['General work','Machinery operation'].map(task=>`<div class="metric-row"><span>${task}</span><strong>${durationLabel(c.work.filter(w=>w.task===task).reduce((n,w)=>n+w.minutes,0))}</strong></div>`).join('')}<div class="section-heading"><h3>Worker totals</h3></div>${[...workers].map(id=>`<div class="metric-row"><span>${esc(workerName(id))}</span><strong>${durationLabel(c.work.filter(w=>w.worker===id).reduce((n,w)=>n+w.minutes,0))}</strong></div>`).join('')||'<p class="small">No confirmed periods yet.</p>'}<div class="notice" style="margin-top:24px">Weights and values are campaign totals. Mixed loads are not divided between properties or parcels without known source quantities. Weighted yield uses only analyses with a positive linked clean net weight.</div>${propertyBreakdown(c)}<button type="button" class="btn secondary" id="export-indicators">Download indicators PDF</button>${btn('View deliveries','deliveries',true)}</div>`;}
function closeCampaign(){const c=currentCampaign();if(!c)return noCampaign();records(c);if(lifecycle(c)==='planned')return campaignHeader(c,'Campaign is planned','Start it explicitly before closing. An unused Planned campaign can instead be deleted from settings.')+btn('Back to campaign','campaignDetails')+'</div>';if(c.status==='closed')return campaignHeader(c,'Campaign closed','You can continue reviewing its records and indicators.')+btn('Back to campaign','campaignDetails')+'</div>';const pending=c.plans.filter(p=>state.attendance[p.day]?.[p.worker]==='present'&&!c.work.some(w=>w.day===p.day&&w.worker===p.worker)),last=[state.day,c.actualStart||c.start,...c.work.map(w=>new Date(w.end*60000).toISOString().slice(0,10)),...c.deliveries.map(d=>(d.arrival||d.departure).slice(0,10))].sort().at(-1);return campaignHeader(c,'Close campaign','Close the operational period while keeping its records and results available.')+`<form id="close-form">${error()}${!c.actualStart?field('close-start','Actual start date','date',c.start):`<p class="small">Actual start · ${esc(c.actualStart)}</p>`}${field('close-end','Actual end date','date',last)}${pending.length?`<div class="notice">${pending.length} planned assignment(s) have presence but no confirmed hours. Missing work can still be completed later within the actual campaign dates.</div>`:''}<div class="notice">After closing, new plans and trips require reopening. Late tickets, analyses and reported values can still be completed. Existing work is preserved.</div><label class="check"><input type="checkbox" required>I confirm the campaign’s operational end date.</label>${submit('Confirm campaign closure')}</form></div>`;}

function workerDetails(){const w=currentWorker();if(!w)return noWorker();const docs=workerDocs(w.id),unsigned=docs.filter(d=>!signedFor(docCurrent(d),w.id)).length,expired=docs.filter(d=>validity(docCurrent(d))[1]==='expired').length,referenced=workerReferenced(w.id);return workerHeader(w.name,'Contact details, identification and documents.','home')+`<div class="row wrap"><span class="badge">${w.active===false?'Inactive':'Active'}</span><span class="badge">${w.machine?'Machinery capable':'General worker'}</span></div><dl class="campaign-meta"><div><dt>Phone</dt><dd><a class="link" href="tel:${esc(w.phone)}">${esc(w.phone)}</a></dd></div><div><dt>Official identification</dt><dd>${esc(w.idType||'Not recorded')} · ${esc(w.idCountry||'')}<br>${esc(w.idNumber||'')}</dd></div></dl><p class="hint">Identification details are entered, not verified.</p>${w.pendingCreation?'<span class="badge pending-badge">New local worker · pending sync</span>':''}${w.description?`<div class="record-card"><h3>Capability notes</h3><p>${esc(w.description)}</p></div>`:''}${w.active===false?'<div class="notice">Inactive: unavailable for new work. History and documents are preserved; review existing plans.</div>':''}${btn('Edit worker','editWorker')}<div class="flow-actions"><button class="flow-card" data-go="workerDocuments"><span><strong>Worker documents</strong><small>${docs.length} document(s) · ${unsigned} awaiting signature · ${expired} expired</small></span><span>→</span></button></div><details class="record-management"><summary>Manage worker record</summary><p class="small">Inactivation keeps history. Deletion is available only when no associated records exist.</p><button type="button" class="btn secondary" id="toggle-worker">${w.active===false?'Reactivate worker':'Inactivate worker'}</button><button type="button" class="btn secondary danger-button" id="delete-worker" ${referenced?'disabled':''}>Delete worker</button>${referenced?'<p class="hint">This worker has associated records and cannot be deleted.</p>':''}</details>${state.workerAction?`<div class="notice" role="alert"><strong>${state.workerAction==='delete'?'Delete this worker record?':w.active===false?'Reactivate this worker?':'Inactivate this worker?'}</strong><p class="small">${state.workerAction==='delete'?'This record has no associated history and will be removed.':'Work history and documents will be preserved.'}</p><div class="action-pair"><button type="button" class="btn small" id="confirm-worker-action">Confirm</button><button type="button" class="btn small secondary" id="cancel-worker-action">Cancel</button></div></div>`:''}</div>`;}
function editWorker(){const w=currentWorker();if(!w)return noWorker();return workerHeader('Edit worker','Update the current record. Changes keep its existing work and document links.')+`<form id="edit-worker-form">${error()}${field('edit-worker-name','Full name','text',w.name)}${field('edit-worker-phone','Phone number','tel',w.phone)}${field('edit-worker-id-type','Official identification type','text',w.idType||'')}${field('edit-worker-id-country','Issuing country','text',w.idCountry||'')}${field('edit-worker-id-number','Identification number','text',w.idNumber||'')}<label class="check"><input type="checkbox" id="edit-worker-machine" ${w.machine?'checked':''}>Can operate machinery</label><div class="field"><label for="edit-worker-notes">Capability notes <span class="optional">Optional</span></label><textarea id="edit-worker-notes">${esc(w.description||'')}</textarea></div><div id="worker-duplicate" class="notice hidden" role="status">Another worker has the same name, phone or official identification. Review before saving; separate records are allowed.</div>${submit('Save changes')}</form></div>`;}
function workerDocuments(){const w=currentWorker();if(!w)return noWorker();const all=workerDocs(w.id),filter=state.docFilter||'All',filtered=all.filter(d=>filter==='All'||d.kind===filter);return workerHeader('Worker documents','Contracts, insurance and other documents linked to this worker.')+`<button class="btn" type="button" id="new-document">Upload document</button>${btn('Generate from demo template','generateDocument',true)}<div class="doc-filters" role="group" aria-label="Document type">${['All','Insurance','Contract','Other'].map(x=>`<button type="button" data-doc-filter="${x}" aria-pressed="${filter===x}">${x}</button>`).join('')}</div>${preparedAssociationForm(w)}${filtered.length?filtered.map(docCard).join(''):'<div class="empty"><h3>No documents here yet</h3><p>Upload a document and associate it with this worker. One source document can be shared with several workers.</p></div>'}</div>`;}
function uploadDocument(){const w=currentWorker();if(!w)return noWorker();const d=state.updateDocument?currentDocument():null;return workerHeader(d?'Upload a new version':'Upload document',d?'The new file becomes current. Signatures from earlier versions are not transferred.':'Select the file and the workers it applies to.','workerDocuments')+`<form id="document-upload-form">${error()}${field('document-title','Document title','text',d?.title||'')}<div class="field"><label for="document-kind">Type</label><select id="document-kind" ${d?'disabled':''}>${['Insurance','Contract','Other'].map(k=>`<option ${d?.kind===k?'selected':''}>${k}</option>`).join('')}</select></div>${field('document-date','Document date','date',new Date().toLocaleDateString('en-CA'))}${field('document-expiry','Valid until','date','',true)}<div class="field"><label for="document-file">File · PDF, JPG or PNG</label><input type="file" id="document-file" accept="application/pdf,image/jpeg,image/png" required><p class="hint">Up to 10 MB. Files stay in this local prototype session.</p></div><h3>Associated workers</h3><div class="worker-checks">${state.workers.map(x=>`<label class="check"><input type="checkbox" name="document-worker" value="${x.id}" ${d?(d.workers.includes(x.id)?'checked disabled':'disabled'):(x.id===w.id?'checked':'')}>${esc(x.name)}</label>`).join('')}</div>${d?'<p class="hint">A new version retains this document’s existing worker associations.</p>':''}<label class="check"><input type="checkbox" id="document-external"><span>This file is already signed by the associated workers.</span></label><div class="notice">Contracts keep all versions. Insurance and other documents keep the current and previous versions, plus every older signed version. A new version needs its own signatures.</div>${submit(d?'Save new version':'Save document')}</form></div>`;}
function sourcePreview(v){return v.type.startsWith('image/')?`<img class="document-image" src="${v.url}" alt="Uploaded document: ${esc(v.fileName)}">`:`<div class="pdf-preview"><span class="doc-kind">PDF document</span><strong>${esc(v.fileName)}</strong><a class="btn secondary" href="${v.url}" target="_blank" rel="noopener">Open original PDF</a></div>`;}
function documentDetails(){const w=currentWorker(),d=currentDocument();if(!w)return noWorker();if(!d||!d.workers.includes(w.id))return workerHeader('Select a document','Choose a document from this worker’s record.','workerDocuments')+btn('View documents','workerDocuments')+'</div>';const v=d.versions.find(v=>v.id===state.selectedVersion)||docCurrent(d),current=v.id===d.current,status=validity(v),signature=v.signatures?.[w.id];return workerHeader(d.title,'Document details and the signature status for '+w.name+'.','workerDocuments')+`<div class="row wrap"><span class="badge">${esc(d.kind)}</span><span class="badge">${current?'Current version':'Earlier version'}</span><span class="badge ${signedFor(v,w.id)?'':'pending-badge'}">${signedFor(v,w.id)?'Signed':'Awaiting signature'}</span></div><div class="field version-picker"><label for="document-version">Version</label><select id="document-version">${[...d.versions].reverse().map(x=>`<option value="${x.id}" ${x.id===v.id?'selected':''}>Version ${x.number} · ${x.date}${x.id===d.current?' · Current':''}${signedFor(x,w.id)?' · Signed':''}</option>`).join('')}</select></div><dl class="campaign-meta"><div><dt>Document date</dt><dd>${esc(v.date)}</dd></div><div><dt>Validity</dt><dd class="${status[1]}">${status[0]}</dd></div></dl>${sourcePreview(v)}<p class="small">${esc(v.fileName)} · ${Math.ceil(v.size/1024)} KB</p><a class="link" href="${v.url}" download="${esc(v.fileName)}">Download original file</a>${signature?`<section class="signed-preview"><h3>${esc(w.name)}’s signature</h3><img src="${signature.image}" alt="Signature by ${esc(w.name)}"><p class="small">Confirmed ${esc(signature.date)} · Version ${v.number}</p><p class="hint">This operational preview shows only this worker’s captured signature. The source document stays unchanged; The downloadable PDF contains a separate signature page for this worker only.</p><button type="button" class="btn secondary" id="download-signed-pdf">Download signed PDF (demo)</button></section>`:v.external?.includes(w.id)?'<div class="notice" style="margin-top:20px">This source file was declared already signed for this worker when uploaded.</div>':current?`<button type="button" class="btn" id="review-sign" style="margin-top:24px">Review and sign</button>`:'<div class="notice" style="margin-top:20px">An earlier unsigned version is kept for consultation. Sign the current version.</div>'}${current?'<button type="button" class="btn secondary" id="replace-document" style="margin-top:12px">Upload new version</button>':''}<p class="footer-note">${d.workers.length>1?'Shared source document · signature status is specific to this worker.':'Individual document'}</p></div>`;}
function signDocument(){const w=currentWorker(),d=currentDocument(),v=d&&docCurrent(d);if(!w)return noWorker();if(!d||!d.workers.includes(w.id))return workerHeader('Select a document','Choose a current document first.','workerDocuments')+btn('View documents','workerDocuments')+'</div>';if(signedFor(v,w.id))return workerHeader('Already signed','This worker has already signed the current version.','documentDetails')+btn('Back to document','documentDetails')+'</div>';state.signingVersion=v.id;return workerHeader('Review and sign','Hand the device to '+w.name+'. The worker reviews the document, draws and accepts their own signature.','documentDetails')+`${error()}<div class="notice"><strong>${esc(d.title)}</strong><br>Version ${v.number} · ${esc(v.date)}<br>Signing as ${esc(w.name)}</div>${sourcePreview(v)}<label class="check"><input type="checkbox" id="reviewed-document">I have read and agree to this document.</label><div class="signature-header"><h3>Your signature</h3><button type="button" class="link" id="clear-signature">Clear</button></div><canvas id="signature-pad" width="1000" height="340" aria-label="Draw your signature using touch, mouse or stylus"></canvas><p class="hint">Use your finger, mouse or stylus. Clear and redraw if needed.</p><label class="check"><input type="checkbox" id="accepted-signature">I accept the signature I have drawn for this document version.</label><button type="button" class="btn" id="confirm-signature">Accept and save signature</button><p class="footer-note">Operational signature demonstration. No real identity verification. An individual PDF can be downloaded after signing.</p></div>`;}

function duplicateCheck(){const name=document.getElementById('edit-worker-name')?.value.trim().toLowerCase(),phone=document.getElementById('edit-worker-phone')?.value.replace(/\D/g,'');const duplicate=state.workers.some(x=>x.id!==w.id&&(x.name.trim().toLowerCase()===name||phone&&x.phone.replace(/\D/g,'')===phone||document.getElementById('edit-worker-id-number').value.trim()&&identificationKey(x)===identificationKey({idType:document.getElementById('edit-worker-id-type').value,idCountry:document.getElementById('edit-worker-id-country').value,idNumber:document.getElementById('edit-worker-id-number').value})));document.getElementById('worker-duplicate')?.classList.toggle('hidden',!duplicate);}

on('toggle-worker','click',()=>{state.workerAction='toggle';render();});on('delete-worker','click',()=>{state.workerAction='delete';render();});on('cancel-worker-action','click',()=>{state.workerAction=null;render();});on('confirm-worker-action','click',()=>{if(state.workerAction==='delete'){if(workerReferenced(w.id)){toast('This worker has associated records and cannot be deleted.');return;}state.workers=state.workers.filter(x=>x.id!==w.id);state.selectedWorker=null;state.homeTab='workers';state.workerAction=null;go('home');toast('Worker record deleted.');}else{w.active=w.active===false;state.workerAction=null;render();toast(w.active?'Worker reactivated.':'Worker inactivated. Existing plans remain available for review.');}});

on('document-upload-form','submit',e=>{e.preventDefault();const d=state.updateDocument?currentDocument():null,workers=d?d.workers:[...app.querySelectorAll('[name="document-worker"]:checked')].map(x=>x.value),file=document.getElementById('document-file').files[0],date=document.getElementById('document-date').value,expiry=document.getElementById('document-expiry').value;if(!workers.length)return showError('Associate the document with at least one worker.');if(!file||!['application/pdf','image/jpeg','image/png'].includes(file.type)||file.size>10000000)return showError('Select a PDF, JPG or PNG file up to 10 MB.');if(expiry&&expiry<date)return showError('Validity cannot end before the document date.');const version={id:'version-'+counter++,number:d?Math.max(...d.versions.map(v=>v.number))+1:1,date,expiry,fileName:file.name,type:file.type,size:file.size,url:URL.createObjectURL(file),signatures:{},external:document.getElementById('document-external').checked?[...workers]:[]};if(d){d.title=document.getElementById('document-title').value.trim();d.versions.push(version);d.current=version.id;if(d.kind!=='Contract'){const previous=d.versions.at(-2)?.id;d.versions=d.versions.filter(v=>{const keep=v.id===d.current||v.id===previous||hasSignature(v);if(!keep)URL.revokeObjectURL(v.url);return keep;});}}else{const record={id:'document-'+counter++,title:document.getElementById('document-title').value.trim(),kind:document.getElementById('document-kind').value,workers,current:version.id,versions:[version]};state.documents.push(record);state.selectedDocument=record.id;if(!workers.includes(state.selectedWorker))state.selectedWorker=workers[0];}state.selectedVersion=null;state.updateDocument=false;go('documentDetails');toast('Current document version saved.');});

app.addEventListener('submit',e=>{if(offlineExpired()){e.preventDefault();e.stopImmediatePropagation();render();return;}if(offlineFormIds.has(e.target.id))watchLocalSave();},true);
app.addEventListener('click',e=>{if(offlineExpired()&&e.target.closest('#confirm-signature')){e.preventDefault();e.stopImmediatePropagation();render();return;}if(e.target.closest('#confirm-signature'))watchLocalSave();},true);

function preparedAssociationForm(w){const options=state.documents.filter(d=>!d.workers.includes(w.id)&&(can('documentsRead')||d.kind==='Insurance'));if(!w.createdInField||!options.length||!can('documentsWrite'))return '';return `<details class="record-management"><summary>Link an available document</summary><form id="associate-document-form"><div class="field"><label for="prepared-document">Already available source</label><select id="prepared-document">${options.map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('')}</select></div><label class="check"><input type="checkbox" required>I reviewed the source and confirm it applies to this worker.</label>${submit('Associate document')}</form><p class="hint">This uses the existing source without changing it. Signing still needs its separate permission.</p></details>`;}
function bindPreparedAssociation(){document.getElementById('associate-document-form')?.addEventListener('submit',e=>{e.preventDefault();const w=currentWorker(),d=state.documents.find(d=>d.id===document.getElementById('prepared-document').value);if(!can('documentsWrite')||!w.createdInField)return;if(!d.workers.includes(w.id))d.workers.push(w.id);render();toast('Document associated. Source unchanged; signature is still separate.');});}

function simplifyManagementPanels(){app.querySelectorAll('details.record-management,details.coverage-details').forEach(details=>{const section=document.createElement('section');section.className=details.className;const summary=details.querySelector(':scope > summary');if(summary){const heading=document.createElement('h3');heading.textContent=summary.textContent;summary.replaceWith(heading);}section.append(...details.childNodes);details.replaceWith(section);});}
function render(){const f={login,register,verify,verified,recover,reset,resetDone,home,property,worker,campaign,campaignDetails,dayPlan,attendance,actualWork,dailySummary,business,deliveries,newDelivery,deliveryDetails,ticket,analysis,valuation,indicators,closeCampaign,startCampaign,workerDetails,editWorker,workerDocuments,uploadDocument,documentDetails,signDocument,propertyDetails,editProperty,editPlan,editWork,editDelivery,managers,managerAccess,generateDocument,moveDelivery,campaignSettings,signOut}[state.view];app.innerHTML=head(['login','register','verify','verified','recover','reset','resetDone'].includes(state.view))+`${sessionBanner()}<div class="content">${routeAllowed(state.view)?f():accessDenied()}</div>`;document.getElementById('simulate-reset').classList.toggle('hidden',!(state.view==='recover'&&state.resetRequested));picker.value=state.view;simulate.classList.toggle('hidden',state.view!=='verify');document.getElementById('review-status').innerHTML=`<strong>${screens[state.view]}</strong> · ${state.mode==='mobile'?'390 × 844 reference':'1194 × 834 reference'} · ${state.properties.length} properties, ${state.workers.length} workers, ${state.campaigns.length} campaigns`;simplifyManagementPanels();bind();applyPreviewGuards();}
function bind(){bindFinal();bindCorrections();bindDocuments();bindHarvest();bindWork();app.querySelectorAll('[data-home-tab]').forEach(b=>b.addEventListener('click',()=>{state.homeTab=b.dataset.homeTab;render();}));app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));app.querySelectorAll('[data-campaign]').forEach(b=>b.addEventListener('click',()=>{state.selectedCampaign=Number(b.dataset.campaign);const c=currentCampaign();state.day=c.selectedDay||c.start;go('campaignDetails');}));const on=(id,event,fn)=>document.getElementById(id)?.addEventListener(event,fn);
 on('login-form','submit',e=>{e.preventDefault();state.lastPermissionsValidation=Date.now();if(document.getElementById('email').value===state.email&&!state.verified){go('verify');return;}if(document.getElementById('email').value!==state.email){showError('Use the demo account or the account created in this prototype.');return;}go('home');});
 on('register-form','submit',e=>{e.preventDefault();state.owner=document.getElementById('full-name').value.trim();state.business=document.getElementById('business-name').value.trim();state.email=document.getElementById('email').value.trim();state.verified=false;state.properties=[];state.workers=[];state.campaigns=[];state.documents=[];state.attendance={};go('verify');});
 on('resend','click',()=>toast('Verification email resent.'));
 on('recover-form','submit',e=>{e.preventDefault();state.resetRequested=true;document.getElementById('recover-message').classList.remove('hidden');document.getElementById('simulate-reset').classList.remove('hidden');});
 on('reset-form','submit',e=>{e.preventDefault();if(document.getElementById('new-password').value!==document.getElementById('confirm-password').value){showError('The passwords do not match. Please try again.');return;}state.resetRequested=false;go('resetDone');});
 on('use-parcels','change',e=>{document.getElementById('parcel-fields').classList.toggle('hidden',!e.target.checked);document.querySelectorAll('.parcel-name').forEach(i=>i.required=e.target.checked);if(e.target.checked&&!state.parcels)addParcel();});
 on('add-parcel','click',addParcel);
 on('property-form','submit',e=>{e.preventDefault();const parcels=document.getElementById('use-parcels').checked?Array.from(document.querySelectorAll('.parcel')).map(p=>({id:'parcel-'+counter++,name:p.querySelector('.parcel-name').value.trim(),area:p.querySelector('.parcel-area').value})):[];state.properties.push({id:'property-'+counter++,name:document.getElementById('property-name').value.trim(),location:document.getElementById('location').value.trim(),area:document.getElementById('area').value,varieties:document.getElementById('varieties').value,parcels});state.homeTab='properties';go('home');toast('Property saved.');});
 on('worker-form','submit',e=>{e.preventDefault();if(['worker-name','phone','worker-id-type','worker-id-country','worker-id-number'].some(id=>!document.getElementById(id).value.trim()))return showError('Complete the name, phone and all official identification fields.');state.workers.push({id:crypto.randomUUID(),idType:document.getElementById('worker-id-type').value.trim(),idCountry:document.getElementById('worker-id-country').value.trim(),idNumber:document.getElementById('worker-id-number').value.trim(),createdInField:!state.online,pendingCreation:!state.online,name:document.getElementById('worker-name').value.trim(),phone:document.getElementById('phone').value.trim(),machine:document.getElementById('machine').checked,description:document.getElementById('description').value});state.homeTab='workers';go('home');toast('Worker saved.');});
 app.querySelectorAll('[data-area-mode]').forEach(s=>s.addEventListener('change',()=>app.querySelector(`[data-parcels="${s.dataset.areaMode}"]`).classList.toggle('hidden',s.value!=='parcels')));
 on('campaign-form','submit',e=>{e.preventDefault();let coverage=[];for(const input of app.querySelectorAll('input[name="property"]:checked')){const p=state.properties.find(x=>x.id===input.value),mode=app.querySelector(`[data-area-mode="${p.id}"]`);if(mode&&mode.value==='parcels'){const selected=Array.from(app.querySelectorAll(`input[name="parcel-${p.id}"]:checked`));if(!selected.length){showError('Select at least one parcel for '+p.name+'.');return;}coverage.push(...selected.map(x=>({propertyId:p.id,parcelId:x.value,label:p.name+' · '+p.parcels.find(q=>q.id===x.value).name})));}else coverage.push({propertyId:p.id,parcelId:null,label:p.name+' · Whole property'});}if(!coverage.length){showError('Select at least one property or parcel.');return;}state.campaigns.push({name:document.getElementById('campaign-name').value.trim(),start:document.getElementById('start').value,coverage});state.selectedCampaign=state.campaigns.length-1;state.day=currentCampaign().start;state.homeTab='campaigns';go('campaignDetails');toast('Campaign created.');});
}
function addParcel(){state.parcels++;const n=state.parcels;document.getElementById('parcel-list').insertAdjacentHTML('beforeend',`<div class="parcel"><div class="field"><label for="parcel-name-${n}">Parcel name</label><input class="parcel-name" id="parcel-name-${n}" required></div><div class="field"><label for="parcel-area-${n}">Area (ha) <span class="optional">Optional</span></label><input class="parcel-area" id="parcel-area-${n}" type="number" min="0" step="any"></div></div>`);}
for(const [id,label]of Object.entries(screens)){const o=document.createElement('option');o.value=id;o.textContent=label;picker.appendChild(o);}picker.addEventListener('change',()=>go(picker.value));
for(const mode of ['mobile','tablet'])document.getElementById(mode).addEventListener('click',()=>{state.mode=mode;device.classList.toggle('tablet',mode==='tablet');for(const b of ['mobile','tablet'])document.getElementById(b).setAttribute('aria-pressed',String(b===mode));document.getElementById('review-status').innerHTML=`<strong>${screens[state.view]}</strong> · ${state.mode==='mobile'?'390 × 844 reference':'1194 × 834 reference'} · ${state.properties.length} properties, ${state.workers.length} workers, ${state.campaigns.length} campaigns`;});
document.getElementById('simulate-reset').addEventListener('click',()=>go('reset'));
simulate.addEventListener('click',()=>{state.verified=true;go('verified');});document.getElementById('restart').addEventListener('click',()=>{Object.assign(state,{view:'login',owner:'Demo Owner',email:'owner@example.com',business:'Olive Harvest Business',verified:true,properties:[],workers:[],campaigns:[],parcels:0,homeTab:'campaigns',resetRequested:false,documents:[],simplePending:0,managers:[],online:true,lastPermissionsValidation:Date.now(),role:'owner',selectedManager:null,selectedWorker:null,selectedDocument:null,workerAction:null,attendance:{},day:'2026-11-01'});clearTimeout(toastTimer);document.getElementById('toast').classList.add('hidden');render();device.scrollTop=0;});render();
})();
</script>
</body>
