<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 670" width="1030" height="670"><rect width="100%" height="100%" fill="white"/><text x="30" y="31" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#172B3A" text-anchor="start">Individual document generation and signed output</text><text x="30" y="56" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Conceptual view | Reusable templates produce separate documents per worker</text><rect x="35" y="105" width="225" height="80" rx="9" fill="#E7F1EE" stroke="#3D7164" stroke-width="1.5"/><text x="147.5" y="133" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">DocumentTemplate</text><text x="147.5" y="154" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">revision / field schema</text><rect x="395" y="105" width="225" height="80" rx="9" fill="#E7F1EE" stroke="#3D7164" stroke-width="1.5"/><text x="507.5" y="133" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">DocumentVersion</text><text x="507.5" y="154" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">one worker through Document</text><text x="507.5" y="170" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">reviewed source / inputs</text><rect x="755" y="105" width="225" height="80" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="867.5" y="133" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">StoredFile</text><text x="867.5" y="154" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Individual accepted source</text><rect x="395" y="325" width="225" height="80" rx="9" fill="#E7F1EE" stroke="#3D7164" stroke-width="1.5"/><text x="507.5" y="353" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">WorkerSignature</text><text x="507.5" y="374" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">document worker + version</text><text x="507.5" y="390" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">explicit response when required</text><rect x="755" y="325" width="225" height="80" rx="9" fill="#E7F1EE" stroke="#3D7164" stroke-width="1.5"/><text x="867.5" y="353" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">DocumentRendition</text><text x="867.5" y="374" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">same worker and version</text><text x="867.5" y="390" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">signed PDF / response</text><rect x="755" y="495" width="225" height="80" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="867.5" y="523" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">StoredFile</text><text x="867.5" y="544" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Derived PDF contents</text><polyline points="260,145 395,145" fill="none" stroke="#486477" stroke-width="1.5"/><rect x="276.324" y="115" width="31.352" height="19" fill="white"/><text x="292" y="131" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..1</text><rect x="345.162" y="115" width="33.676" height="19" fill="white"/><text x="362" y="131" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..N</text><polyline points="620,145 755,145" fill="none" stroke="#486477" stroke-width="1.5"/><rect x="632.162" y="115" width="33.676" height="19" fill="white"/><text x="649" y="131" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..N</text><rect x="716.108" y="115" width="15.784" height="19" fill="white"/><text x="724" y="131" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">1</text><polyline points="507,185 507,325" fill="none" stroke="#486477" stroke-width="1.5"/><rect x="520.108" y="197" width="15.784" height="19" fill="white"/><text x="528" y="213" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">1</text><rect x="520.324" y="288" width="31.352" height="19" fill="white"/><text x="536" y="304" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..1</text><polyline points="620,365 755,365" fill="none" stroke="#486477" stroke-width="1.5"/><rect x="641.108" y="335" width="15.784" height="19" fill="white"/><text x="649" y="351" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">1</text><rect x="705.324" y="335" width="31.352" height="19" fill="white"/><text x="721" y="351" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..1</text><polyline points="867,405 867,495" fill="none" stroke="#486477" stroke-width="1.5"/><rect x="878.162" y="414" width="33.676" height="19" fill="white"/><text x="895" y="430" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..N</text><rect x="880.108" y="460" width="15.784" height="19" fill="white"/><text x="888" y="476" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">1</text><text x="35" y="600" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#172B3A" text-anchor="start">A rendition requires the accepted signature for its individual source version and matching worker.</text><text x="35" y="624" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#172B3A" text-anchor="start">Freeze template revision and reviewed inputs. Signing adds evidence, explicit response and a derived PDF.</text><text x="35" y="648" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#172B3A" text-anchor="start">Every source version belongs to one Document and one worker. Uploaded sources have no template reference.</text></svg>