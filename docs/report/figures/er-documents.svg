<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 690" width="1030" height="690"><rect width="100%" height="100%" fill="white"/><text x="30" y="31" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#172B3A" text-anchor="start">Individual worker documents</text><text x="30" y="56" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Conceptual ER view | One worker per document; version-specific evidence</text><rect x="35" y="100" width="225" height="80" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="147.5" y="128" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">Worker</text><text x="147.5" y="149" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Business-specific identity</text><rect x="395" y="100" width="225" height="80" rx="9" fill="#E7F1EE" stroke="#3D7164" stroke-width="1.5"/><text x="507.5" y="128" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">Document</text><text x="507.5" y="149" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">one required worker</text><text x="507.5" y="165" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">category / title / subtype</text><rect x="755" y="100" width="225" height="80" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="867.5" y="128" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">User</text><text x="867.5" y="149" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Signing initiator</text><rect x="35" y="315" width="225" height="80" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="147.5" y="343" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">StoredFile</text><text x="147.5" y="364" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Individual source contents</text><rect x="395" y="315" width="225" height="80" rx="9" fill="#E7F1EE" stroke="#3D7164" stroke-width="1.5"/><text x="507.5" y="343" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">DocumentVersion</text><text x="507.5" y="364" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">source / revision</text><text x="507.5" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">expiry / withdrawal</text><rect x="755" y="315" width="225" height="80" rx="9" fill="#E7F1EE" stroke="#3D7164" stroke-width="1.5"/><text x="867.5" y="343" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">WorkerSignature</text><text x="867.5" y="364" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">document worker / version</text><text x="867.5" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">signature + explicit response</text><rect x="755" y="500" width="225" height="80" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/><text x="867.5" y="528" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#172B3A" text-anchor="middle">StoredFile</text><text x="867.5" y="549" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Signature evidence</text><polyline poi