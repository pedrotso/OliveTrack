yline points="867,180 867,315" fill="none" stroke="#486477" stroke-width="1.5"/><rect x="880.108" y="190" width="15.784" height="19" fill="white"/><text x="888" y="206" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">1</text><rect x="877.162" y="277" width="33.676" height="19" fill="white"/><text x="894" y="293" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..N</text><polyline points="867,395 867,500" fill="none" stroke="#486477" stroke-width="1.5"/><rect x="877.162" y="405" width="33.676" height="19" fill="white"/><text x="894" y="421" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">0..N</text><rect x="880.108" y="465" width="15.784" height="19" fill="white"/><text x="888" y="481" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#486477" text-anchor="middle">1</text><text x="35" y="610" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#172B3A" text-anchor="start">WorkerSignature.worker_id must equal the worker of its Document; accepted document ownership is fixed.</text><text x="35" y="634" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#172B3A" text-anchor="start">One current source per document. Replacement deletes its old source, signature and signed PDF.</text><text x="35" y="658" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#172B3A" text-anchor="start">StoredFile is shown in context for source and signature bytes; access follows the owning individual document.</text></svg>